<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lista de productos y servicios - AMC Facturación</title><script src="../js/auth-check.js"></script><link rel="stylesheet" href="../css/estilos.css"><style>
  .wrap{max-width:1440px;margin:0 auto;padding:24px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.top-actions,.actions{display:flex;gap:8px;flex-wrap:wrap}.cardx{background:#f8fcff;border:1px solid #cde7f0;border-radius:12px;box-shadow:0 10px 18px rgba(0,0,0,.06);overflow:hidden}.filters{padding:18px;border-bottom:1px solid #d7edf5}.filters label{display:block;margin-bottom:6px;color:#35586a;font-size:.82rem;font-weight:700;text-transform:uppercase}.filters input{box-sizing:border-box;width:min(430px,100%);padding:11px 12px;border:1px solid #a9beca;border-radius:8px;font:inherit}.table-scroll{overflow:auto}table{width:100%;min-width:1080px;border-collapse:collapse}th,td{padding:14px 15px;border-bottom:1px solid #d9e8ee;text-align:left;color:#244657}th{background:#f4f9fc;color:#123344;font-size:.78rem;text-transform:uppercase}.num{text-align:right}.badge-tipo{display:inline-block;padding:3px 7px;border-radius:10px;font-size:.72rem;font-weight:800}.badge-producto{background:#e8faff;color:#0032c8}.badge-servicio{background:#eaf9fe;color:#001e82}.btn-primary,.btn-secondary,.btn-usar,.btn-edit,.btn-del{border:0;border-radius:7px;padding:9px 12px;color:#fff;background:#0032c8;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.btn-secondary,.btn-edit{background:#001e82}.btn-del{background:#d94d6a}.empty{padding:28px;text-align:center;color:#638092}.hint{margin:5px 0 0;color:#527083}.alert{margin:0 0 14px;padding:11px 13px;border-radius:8px}.alert-success{background:#e6f7ef;color:#16734f}.alert-error{background:#fff0f2;color:#a0233d}@media(max-width:720px){.wrap{padding:16px}}
</style></head>
<body><main class="wrap"><header class="topbar"><div><h1 style="margin:0;color:#001e82;font-size:1.7rem">Lista de productos y/o servicios</h1><p class="hint">Catálogo central para facturación, cotizaciones, reportes e inventarios.</p></div><div class="top-actions"><a class="btn-primary" href="productos.html">Crear producto/servicio</a><a class="btn-secondary" href="../index.html">Ir a inicio</a></div></header><div id="msg" aria-live="polite"></div><section class="cardx"><div class="filters"><label for="buscar">Buscar por nombre o código</label><input id="buscar" type="search" placeholder="Ej.: asesoría / SER-001"></div><div class="table-scroll"><table><thead><tr><th>Tipo</th><th>Producto o servicio</th><th>Código</th><th>Unidad</th><th class="num">Precio</th><th class="num">Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="lista"></tbody></table></div><div id="empty" class="empty" style="display:none">No hay productos o servicios registrados.</div></section></main><script src="productos.js"></script><script src="../js/app-footer.js"></script></body>
</html>
