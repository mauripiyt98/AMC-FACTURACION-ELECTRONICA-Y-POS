<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear producto o servicio - AMC Facturacion</title>
  <script src="../js/auth-check.js"></script>
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    .wrap { max-width: 760px; margin: 0 auto; padding: 18px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin: 10px 0 16px; flex-wrap:wrap; }
    .top-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .btn-naranja { background:#0032c8; color:#f8fcff; border:none; padding:10px 16px; border-radius:6px; font-weight:800; cursor:pointer; }
    .btn-naranja:hover { background:#001e82; }
    .btn-sec { background:#001e82; color:#f8fcff; border:none; padding:10px 16px; border-radius:6px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
    .btn-sec:hover { background:#00155c; }

    .cardx { background:#f8fcff; border-radius:10px; box-shadow: 0 10px 18px rgba(0,0,0,.06); padding:16px; margin-bottom:14px; }
    .grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
    .grid .full { grid-column: 1 / -1; }
    label { display:block; font-size:.82rem; color:#35586a; margin-bottom:6px; text-transform: uppercase; letter-spacing: 0; font-weight: 600; }
    input, select { width:100%; padding:10px 12px; border:1px solid #cde7f0; border-radius:8px; background: #f4fbff; font-family: inherit; font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: #0b46eb; box-shadow: 0 0 0 3px rgba(11, 70, 235, 0.18); background:#f8fcff; }
    .hint { font-size:.85rem; color:#527083; margin: 6px 0 0; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="topbar">
      <div>
        <h2 id="page-title" style="margin:0;color:#001e82;">Crear producto o servicio</h2>
        <div class="hint">Este formulario guarda el item en la base de productos y servicios.</div>
      </div>
      <div class="top-actions">
        <a class="btn-sec" href="productos.html">Ver base de productos</a>
        <button type="button" class="btn-sec" id="btn-volver">Volver a factura</button>
        <a class="btn-sec" href="../index.html" style="background:#eaf9fe; color:#0b46eb; border:1px solid #cde7f0;">Ir a inicio</a>
      </div>
    </div>

    <div id="msg"></div>

    <div class="cardx" id="form-card">
      <h3 id="form-titulo" style="margin:0 0 12px;color:#001e82;">Crear producto / servicio</h3>
      <div class="grid">
        <div class="full">
          <label for="p-nombre">Nombre o descripcion del item</label>
          <input id="p-nombre" type="text" placeholder="Ej: Gasolina corriente / Consultoria de sistemas">
        </div>
        <div>
          <label for="p-codigo">Codigo de producto</label>
          <input id="p-codigo" type="text" placeholder="Ej: P-001 / SER-05">
        </div>
        <div>
          <label for="p-tipo">Tipo de item</label>
          <select id="p-tipo">
            <option value="PRODUCTO" selected>Producto</option>
            <option value="SERVICIO">Servicio</option>
          </select>
        </div>
        <div>
          <label for="p-iva">Tarifa IVA aplicable</label>
          <select id="p-iva">
            <option value="19" selected>IVA 19%</option>
            <option value="5">IVA 5%</option>
            <option value="0">IVA 0%</option>
          </select>
        </div>
        <div>
          <label for="p-unidad">Unidad de medida</label>
          <select id="p-unidad">
            <option value="UNIDAD" selected>Unidad</option>
            <option value="GALON">Galon</option>
          </select>
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
        <button type="button" class="btn-naranja" id="btn-guardar">Guardar item</button>
        <button type="button" class="btn-sec" id="btn-guardar-usar">Guardar y usar en factura</button>
        <button type="button" class="btn-sec" id="btn-limpiar">Limpiar</button>
      </div>
    </div>
  </div>

  <script src="productos.js"></script>
  <script src="../js/app-footer.js"></script>
</body>
</html>
