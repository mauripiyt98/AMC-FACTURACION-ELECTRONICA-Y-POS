<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear producto o servicio - AMC Facturación</title>
  <script src="../js/auth-check.js"></script>
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    .wrap{max-width:820px;margin:0 auto;padding:24px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top-actions,.form-actions{display:flex;gap:10px;flex-wrap:wrap}.cardx{padding:20px;border-radius:12px;background:#f8fcff;box-shadow:0 10px 18px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{display:block;margin-bottom:6px;color:#35586a;font-size:.82rem;font-weight:700;text-transform:uppercase}input,select{box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #cde7f0;border-radius:8px;background:#fff;font:inherit}.hint{margin:5px 0 0;color:#527083;font-size:.88rem}.btn-primary,.btn-secondary{border:0;border-radius:7px;padding:11px 15px;color:#fff;background:#0032c8;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.btn-secondary{background:#001e82}@media(max-width:720px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar"><div><h1 id="page-title" style="margin:0;color:#001e82;font-size:1.65rem">Crear producto o servicio</h1><p class="hint">Registra la información en el catálogo central protegido en SQL.</p></div><div class="top-actions"><a class="btn-secondary" href="lista-productos.html">Lista de productos y/o servicios</a><a class="btn-secondary" href="../index.html">Ir a inicio</a></div></header>
    <div id="msg" aria-live="polite"></div>
    <section class="cardx"><h2 id="form-titulo" style="margin:0 0 15px;color:#001e82;font-size:1.15rem">Crear producto / servicio</h2><div class="grid">
      <div class="full"><label for="p-nombre">Nombre o descripción</label><input id="p-nombre" type="text" placeholder="Ej.: Consultoría de sistemas"></div>
      <div><label for="p-codigo">Código</label><input id="p-codigo" type="text" placeholder="Ej.: SER-001"></div><div><label for="p-tipo">Tipo</label><select id="p-tipo"><option value="PRODUCTO">Producto</option><option value="SERVICIO">Servicio</option></select></div>
      <div><label for="p-iva">Tarifa IVA</label><select id="p-iva"><option value="19">IVA 19%</option><option value="5">IVA 5%</option><option value="0">IVA 0%</option></select></div><div><label for="p-unidad">Unidad de medida</label><select id="p-unidad"><option value="UNIDAD">Unidad</option><option value="GALON">Galón</option><option value="KG">Kilogramo</option><option value="HORA">Hora</option></select></div>
      <div><label for="p-precio">Precio unitario</label><input id="p-precio" type="number" min="0" step="0.01" value="0"></div><div><label for="p-stock-total">Stock inicial / actual</label><input id="p-stock-total" type="number" min="0" step="0.01" value="0"></div>
      <div><label for="p-stock-minimo">Stock mínimo</label><input id="p-stock-minimo" type="number" min="0" step="0.01" value="0"></div>
    </div><div class="form-actions" style="margin-top:18px"><button id="btn-guardar" class="btn-primary" type="button">Guardar en catálogo</button><button id="btn-guardar-usar" class="btn-secondary" type="button">Guardar y usar en factura</button><button id="btn-limpiar" class="btn-secondary" type="button">Limpiar</button></div></section>
  </main>
  <script src="productos.js"></script><script src="../js/app-footer.js"></script>
</body>
</html>
