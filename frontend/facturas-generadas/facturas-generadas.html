<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturas generadas - AMC Facturacion</title>
  <script src="../js/auth-check.js"></script>
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    .wrap { max-width: 1120px; margin: 0 auto; padding: 18px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin: 10px 0 16px; flex-wrap:wrap; }
    .top-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .btn-sec { background:#001e82; color:#f8fcff; border:none; padding:10px 16px; border-radius:6px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
    .btn-sec:hover { background:#00155c; }
    .btn-naranja { background:#0032c8; color:#f8fcff; border:none; padding:10px 16px; border-radius:6px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
    .btn-naranja:hover { background:#001e82; }

    .cardx { background:#f8fcff; border-radius:10px; box-shadow: 0 10px 18px rgba(0,0,0,.06); padding:16px; margin-bottom:14px; border:1px solid #cde7f0; }
    .hint { font-size:.85rem; color:#527083; margin: 6px 0 0; }
    .stats-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:10px; }
    .stat { background:#f4fbff; border:1px solid #d7edf5; border-radius:8px; padding:12px; }
    .stat label { display:block; margin:0 0 4px; font-size:.72rem; color:#527083; text-transform:uppercase; letter-spacing:0; }
    .stat strong { color:#001e82; font-size:1.2rem; }
    .stat.stat-pos strong { color:#059669; }
    label { display:block; font-size:.82rem; color:#35586a; margin-bottom:6px; text-transform:uppercase; letter-spacing:0; font-weight:700; }
    input { width:100%; padding:10px 12px; border:1px solid #cde7f0; border-radius:8px; background:#f4fbff; font-family:inherit; }
    input:focus { outline:none; border-color:#0b46eb; box-shadow:0 0 0 3px rgba(11,70,235,.18); background:#f8fcff; }

    .table-wrap { overflow-x:auto; margin-top:12px; }
    table { width:100%; border-collapse:collapse; font-size:.86rem; }
    th { text-align:left; background:#001e82; color:#f8fcff; padding:9px 8px; white-space:nowrap; }
    td { border-bottom:1px solid #d7edf5; padding:9px 8px; vertical-align:top; }
    .num { text-align:right; white-space:nowrap; }
    .empty { color:#638092; padding: 14px 4px; }
    .badge { display:inline-block; background:#eaf9fe; color:#0032c8; border-radius:999px; padding:3px 8px; font-size:.72rem; font-weight:800; }
    .badge-pos { display:inline-block; background:#ecfdf5; color:#059669; border-radius:999px; padding:3px 8px; font-size:.72rem; font-weight:800; }
    .badge-fe  { display:inline-block; background:#eaf9fe; color:#0032c8; border-radius:999px; padding:3px 8px; font-size:.72rem; font-weight:800; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h2 style="margin:0;color:#001e82;">Facturas generadas</h2>
        <div class="hint">Base local de facturas emitidas en el sistema. Rango demo configurado: FE-0001 a FE-1000.</div>
      </div>
      <div class="top-actions">
        <a class="btn-naranja" href="../index.html?sec=crear-factura">Crear factura</a>
        <a class="btn-sec" href="../index.html">Volver al inicio</a>
      </div>
    </div>

    <div class="cardx">
      <div class="stats-grid">
        <div class="stat">
          <label>Resolucion FE</label>
          <strong id="stat-resolucion">18760000001</strong>
        </div>
        <div class="stat">
          <label>Rango FE autorizado</label>
          <strong id="stat-rango">1 - 1000</strong>
        </div>
        <div class="stat">
          <label>Facturas FE generadas</label>
          <strong id="stat-generadas">0</strong>
        </div>
        <div class="stat">
          <label>Siguiente FE</label>
          <strong id="stat-siguiente">FE-0001</strong>
        </div>
        <div class="stat stat-pos">
          <label>Facturas POS generadas</label>
          <strong id="stat-pos-generadas">0</strong>
        </div>
        <div class="stat stat-pos">
          <label>Siguiente POS</label>
          <strong id="stat-pos-siguiente">POS-001</strong>
        </div>
      </div>
    </div>

    <div class="cardx">
      <h3 style="margin:0 0 10px;color:#001e82;">Consultar facturas</h3>
      <label for="buscar">Buscar por numero, consecutivo, cliente, documento o fecha</label>
      <input id="buscar" type="text" placeholder="Ej: FE-0001 / 900123456 / Cliente">
      <div id="empty" class="empty" style="display:none;">Aun no hay facturas generadas.</div>
      <div class="table-wrap">
        <table aria-label="Facturas generadas">
          <thead>
            <tr>
              <th>Factura</th>
              <th>Tipo</th>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Documento</th>
              <th>Lineas</th>
              <th class="num">Total</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="facturas-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../js/facturas_seed.js"></script>
  <script src="facturas-generadas.js"></script>
  <script src="../js/app-footer.js"></script>
</body>
</html>
