<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventarios - AMC Facturación</title>
  <script src="../js/auth-check.js"></script>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="inventarios.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" defer></script>
</head>
<body>
  <main class="inventory-page">
    <header class="inventory-header">
      <div>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
        <h1>Productos y servicios</h1>
        <p>Gestión de productos / servicios</p>
      </div>
    </header>

    <section class="inventory-card" aria-label="Listado de productos y servicios">
      <section class="inventory-filters" aria-label="Filtros del reporte de inventario">
        <div class="filter-group product-filter">
          <label for="buscar-producto">Producto o servicio</label>
          <input id="buscar-producto" type="search" placeholder="Nombre o código">
        </div>
        <div class="filter-group">
          <label for="filtro-tipo">Tipo</label>
          <select id="filtro-tipo"><option value="">Todos</option><option value="PRODUCTO">Producto</option><option value="SERVICIO">Servicio</option></select>
        </div>
        <div class="filter-group">
          <label for="filtro-estado">Estado</label>
          <select id="filtro-estado"><option value="">Todos</option><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select>
        </div>
        <div class="filter-group">
          <label for="filtro-stock">Existencias</label>
          <select id="filtro-stock"><option value="">Todas</option><option value="DISPONIBLE">Con existencias</option><option value="AGOTADO">Agotado</option><option value="BAJO">Stock bajo</option></select>
        </div>
        <div class="filter-actions">
          <button type="button" id="btn-consultar" class="btn-primary">Consultar reporte</button>
          <button type="button" id="btn-limpiar" class="btn-outline">Limpiar</button>
          <button type="button" id="btn-exportar-pdf" class="btn-outline btn-export">Exportar a PDF</button>
          <button type="button" id="btn-exportar-excel" class="btn-outline btn-export">Exportar a Excel</button>
        </div>
        <div class="create-action">
        <a class="btn-primary" href="../productos/productos.html">Crear / Importar</a>
        </div>
      </section>

      <div id="inventory-message" aria-live="polite"></div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Tipo</th>
              <th>Nombre</th>
              <th>Código</th>
              <th>Unidad</th>
              <th class="num">Precio unitario</th>
              <th>Estado</th>
              <th class="num">Stock total</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="inventory-list"></tbody>
        </table>
      </div>
      <p id="inventory-empty" class="inventory-empty" hidden>No hay productos o servicios creados todavía.</p>
    </section>
  </main>
  <script src="inventarios.js"></script>
  <script src="../js/app-footer.js"></script>
</body>
</html>
