<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base de terceros - AMC Facturacion</title>
  <script src="../js/auth-check.js"></script>
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin: 10px 0 16px; flex-wrap:wrap; }
    .top-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .btn-naranja { background:#0032c8; color:#f8fcff; border:none; padding:10px 16px; border-radius:6px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
    .btn-naranja:hover { background:#001e82; }
    .btn-sec { background:#001e82; color:#f8fcff; border:none; padding:10px 16px; border-radius:6px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
    .btn-sec:hover { background:#00155c; }

    .cardx { background:#f8fcff; border-radius:10px; box-shadow: 0 10px 18px rgba(0,0,0,.06); padding:16px; margin-bottom:14px; }
    label { display:block; font-size:.82rem; color:#35586a; margin-bottom:6px; }
    input { width:100%; padding:10px 12px; border:1px solid #cde7f0; border-radius:8px; }

    .hint { font-size:.85rem; color:#527083; margin: 6px 0 0; }
    .list { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:10px; margin-top:12px; }
    .item { border:1px solid #d7edf5; border-radius:10px; padding:12px; background:#f4fbff; }
    .item strong { display:block; color:#001e82; font-size:1rem; }
    .item .meta { color:#35586a; font-size:.85rem; margin:6px 0 10px; }
    .item .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .item button { border:none; border-radius:8px; padding:8px 10px; cursor:pointer; font-weight:800; }
    .btn-usar { background:#0032c8; color:#f8fcff; }
    .btn-usar:hover { background:#001e82; }
    .btn-edit { background:#001e82; color:#f8fcff; }
    .btn-edit:hover { background:#00155c; }
    .btn-del { background:#d94d6a; color:#f8fcff; }
    .btn-del:hover { background:#b83650; }

    .empty { color:#638092; padding: 10px 4px; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="topbar">
      <div>
        <h2 style="margin:0;color:#001e82;">Base de terceros</h2>
        <div class="hint">Consulta, edita o selecciona clientes guardados para cargarlos en la factura por documento o nombre.</div>
      </div>
      <div class="top-actions">
        <a class="btn-naranja" href="crear-tercero.html">Crear tercero</a>
        <button type="button" class="btn-sec" id="btn-volver">Volver a factura</button>
        <a class="btn-sec" href="../index.html" style="background:#eaf9fe; color:#0b46eb; border:1px solid #cde7f0;">Ir a inicio</a>
      </div>
    </div>

    <div id="msg"></div>

    <div class="cardx">
      <h3 style="margin:0 0 10px;color:#001e82;">Buscar en terceros</h3>
      <label for="buscar">Buscar por nombre o documento (minimo 3 caracteres)</label>
      <input id="buscar" type="text" placeholder="Ej: jua / 123">
      <div class="hint">Esta base alimenta la pantalla principal de factura y el boton "Usar en factura".</div>

      <div id="lista" class="list"></div>
      <div id="empty" class="empty" style="display:none;">No hay terceros guardados aun.</div>
    </div>
  </div>

  <script src="terceros.js"></script>
  <script src="../js/app-footer.js"></script>
</body>
</html>
