<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario empresarial | AMC</title>
  <link rel="stylesheet" href="css/estilos.css?v=20260924-4">
  <link rel="stylesheet" href="calendario/calendario.css?v=20260924-5">
  <link rel="stylesheet" href="calendario/calendario-dialogs.css?v=20260924-1">
  <script defer src="calendario/calendario.js?v=20260924-6"></script>
</head>
<body>
  <main class="calendar-page">
    <header class="calendar-page-header">
      <a href="index.html" class="calendar-back">← Inicio</a>
      <div><p>PLANIFICACIÓN OPERATIVA</p><h1>Calendario empresarial</h1><span>Organice obligaciones, reuniones y vencimientos de su empresa.</span></div>
      <button id="new-event" class="calendar-primary" type="button">+ Nuevo evento</button>
    </header>
    <section class="calendar-layout">
      <article class="calendar-board">
        <header class="calendar-board-head"><button id="previous-year" type="button" aria-label="Año anterior">‹</button><h2 id="month-title"></h2><button id="next-year" type="button" aria-label="Año siguiente">›</button><button id="today-month" class="calendar-today" type="button">Año actual</button></header>
        <div id="calendar-grid" class="calendar-grid" aria-label="Calendario anual"></div>
      </article>
      <aside class="calendar-side">
        <section><h2>Próximos vencimientos</h2><div id="upcoming-events" class="calendar-event-list"></div></section>
        <section class="calendar-legend"><h2>Tipos de evento</h2><span><i class="tax"></i> Impuesto</span><span><i class="payroll"></i> Nómina</span><span><i class="collection"></i> Cobro</span><span><i class="meeting"></i> Reunión</span><span><i class="task"></i> Tarea</span></section>
      </aside>
    </section>
  </main>
  <dialog id="day-dialog" class="day-dialog"><header><div><p>DÍA SELECCIONADO</p><h2 id="selected-date-title"></h2></div><button type="button" id="close-day-dialog" aria-label="Cerrar">×</button></header><div id="selected-day-events" class="selected-day-events"></div><button type="button" id="add-event-to-day" class="calendar-primary">+ Agregar evento a este día</button></dialog>
  <dialog id="event-dialog" class="event-dialog"><form id="event-form"><header><div><p id="form-kicker">NUEVO REGISTRO</p><h2 id="form-title">Programar evento</h2></div><button type="button" id="close-dialog" aria-label="Cerrar">×</button></header><input id="event-id" type="hidden"><label>Título<input id="event-title" name="titulo" maxlength="160" required placeholder="Ej. Vencimiento declaración IVA"></label><label>Descripción<textarea id="event-description" name="descripcion" rows="2" placeholder="Detalle o referencia del evento"></textarea></label><div class="event-form-grid"><label>Fecha<input id="event-date" name="fecha_inicio" type="date" required></label><label>Categoría<select id="event-category" name="categoria"><option value="GENERAL">General</option><option value="IMPUESTO">Impuesto</option><option value="NOMINA">Nómina</option><option value="COBRO">Cobro</option><option value="REUNION">Reunión</option><option value="TAREA">Tarea</option></select></label></div><div class="event-form-grid"><label>Color<input id="event-color" name="color" type="color" value="#0b46eb"></label><label>Recordatorio<select id="event-reminder" name="recordatorio_dias"><option value="">Sin recordatorio</option><option value="0">El mismo día</option><option value="1">1 día antes</option><option value="3">3 días antes</option><option value="7">7 días antes</option></select></label></div><label class="event-completed"><input id="event-completed" type="checkbox"> Marcar como completado</label><p id="form-message" class="event-form-message" aria-live="polite"></p><footer><button type="button" id="delete-event" class="calendar-delete" hidden>Eliminar</button><button type="submit" class="calendar-primary">Guardar evento</button></footer></form></dialog>
</body>
</html>
